name: Daily Fed Tone Agent

on:
  schedule:
    # 14:00 UTC daily (after most Fed speeches are posted).
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Never run two agent jobs at once (both would write seen.json).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  run-agent:
    # Tests must pass first; only run the agent on the schedule
    # or a manual trigger, not on every push or PR.
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m agent.main

      - name: Commit updated data
        run: |
          git config user.name "Aweksha"
          git config user.email "86869105+Aweksha@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update tracked speeches [skip ci]"
            git push
          fi
