name: Daily Fed Tone Agent

on:
  schedule:
    # 14:00 UTC daily (after most Fed speeches are posted).
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Never run two agent jobs at once (both would write seen.json).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  run-agent:
    # Tests must pass first; only run the agent on the schedule
    # or a manual trigger, not on every push or PR.
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m agent.main

      - name: Commit updated data
        run: |
          git config user.name "Aweksha"
          git config user.email "86869105+Aweksha@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update tracked speeches [skip ci]"
            git push
          fi

  deploy-site:
    # Publish the website after tests pass: on pushes to main, and after
    # each agent run (so the page picks up the newly committed data).
    needs: [test, run-agent]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.run-agent.result == 'success' || needs.run-agent.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the latest main, which includes the agent's data commit.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/tone.json _site/data/tone.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
